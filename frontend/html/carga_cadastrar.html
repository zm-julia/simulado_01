<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/carga_cadastrar.js" defer></script>
    <link rel="stylesheet" href="./css/">
    <title>Cadastrar</title>
</head>
<body> 
    <header>
         <nav> <a href="../index.html">Home</a></nav>
    </header>

    <main>
        <h1>Cadastrar Carga</h1><br><br>
        <form>
            <label for="descricao">descricao:</label><br>
            <input type="text" id="descricao" required><br><br>

            <label for="peso">peso:</label><br>
            <input type="number" id="peso" required><br><br>

            <label for="volume">volume:</label><br>
            <input type="number" id="volume" required><br><br>

            <label for="codRastreio">codRastreio:</label><br>
            <input type="text" id="codRastreio" required><br><br>

            <label for="idMotorista">idMotorista:</label><br>
            <input type="number" id="idMotorista" required><br><br>
            
            <button id="btn_cadastrar">Cadastrar</button>
        </form>
    </main>

    <div id="resposta_cadastrar" class="resposta_cadastrar"></div>
    
</body>
</html>
