<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/entrega_cadastrar.js" defer></script>
    <link rel="stylesheet" href="./css/">
    <title>Cadastrar</title>
</head>
<body> 
    <header>
         <nav> <a href="../index.html">Home</a></nav>
    </header>

    <main>
        <h1>Cadastrar Entrega</h1><br><br>
        <form>
            <label for="cidade">cidade:</label><br>
            <input type="text" id="cidade" required><br><br>

           <select name="statusAtual" id="statusAtual">
            <option value="ENTREGUE">ENTREGUE</option>
            <option value="TRANSITO">TRANSITO</option>
           </select>

            <label for="data">data:</label><br>
            <input type="date" id="data" required><br><br>

            <label for="hora">hora:</label><br>
            <input type="time" id="hora" required><br><br>

            <label for="idCarga">idCarga:</label><br>
            <input type="number" id="idCarga" required><br><br>
            
            <button id="btn_cadastrar">Cadastrar</button>
        </form>
    </main>

    <div id="resposta_cadastrar" class="resposta_cadastrar"></div>
    
</body>
</html>
